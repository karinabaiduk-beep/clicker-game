<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Боевая Карточка Босса - Кибер-Дракон</title>
    <style>
        /* ==========================================================================
           1. RESET & BASE STYLES
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #07070c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Cyberpunk Grid & Glow Background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -100%;
            left: -50%;
            background-image: 
                linear-gradient(to right, rgba(112, 0, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(112, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotateX(60deg);
            z-index: 1;
            pointer-events: none;
        }

        .bg-glow-purple {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(103, 37, 158, 0.25) 0%, rgba(218, 52, 52, 0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .bg-glow-red {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 0, 85, 0.2) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            left: 50%;
            transform: translate(-50%, 50%);
            z-index: 1;
            pointer-events: none;
        }

        /* ==========================================================================
           2. MAIN CONTAINER & CARD STYLES
           ========================================================================== */
        .wrapper {
            position: relative;
            z-index: 10;
            padding: 20px;
            width: 100%;
            max-width: 440px;
        }

        .boss-card {
            background: rgba(18, 12, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #7000ff;
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 
                0 0 25px rgba(112, 0, 255, 0.3),
                0 0 50px rgba(255, 0, 85, 0.15),
                inset 0 0 15px rgba(112, 0, 255, 0.2);
            position: relative;
            transition: border-color 2s ease, box-shadow 0.4s ease;
            overflow: hidden;
        }

        /* Decorative Corner Accents */
        .boss-card::before, .boss-card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #ff0055;
            border-style: solid;
            pointer-events: none;
        }
        .boss-card::before {
            top: 8px;
            left: 8px;
            border-width: 2px 0 0 2px;
        }
        .boss-card::after {
            bottom: 8px;
            right: 8px;
            border-width: 0 2px 2px 0;
        }

        /* Card Shake Animation */
        .shake {
            animation: cardShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes cardShake {
            10%, 90% { transform: translate3d(-2px, 1px, 0) rotate(-0.5deg); }
            20%, 80% { transform: translate3d(4px, -2px, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-6px, 3px, 0) rotate(-1.5deg); }
            40%, 60% { transform: translate3d(6px, -3px, 0) rotate(1.5deg); }
        }

        /* Red Damage Flash Screen/Card overlay */
        .damage-flash {
            position: absolute;
            inset: 0;
            background: rgba(255, 0, 85, 0.25);
            pointer-events: none;
            opacity: 0;
            border-radius: 18px;
            transition: opacity 0.1s ease-out;
            z-index: 20;
        }
        .damage-flash.active {
            opacity: 1;
        }

        /* Floating Damage Text Container */
        .floating-text-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 30;
        }

        .floating-number {
            position: absolute;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            animation: floatUp 0.8s ease-out forwards;
            white-space: nowrap;
        }

        .floating-number.damage {
            color: #ff2a6d;
            text-shadow: 0 0 12px #ff0055, 0 0 20px #ff0055;
        }

        .floating-number.heal {
            color: #00ffcc;
            text-shadow: 0 0 12px #00ffcc, 0 0 20px #00ffcc;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, 0) scale(0.8);
            }
            50% {
                transform: translate(-50%, -35px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -60px) scale(1);
            }
        }

        /* ==========================================================================
           3. HEADER & STATUS TAGS
           ========================================================================== */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .boss-badge {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid #ff0055;
            color: #ff0055;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
        }

        .status-tag {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 6px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .status-tag.active {
            background: rgba(5, 217, 232, 0.15);
            border: 1px solid #05d9e8;
            color: #05d9e8;
            box-shadow: 0 0 10px rgba(5, 217, 232, 0.3);
        }

        .status-tag.defeated {
            background: rgba(255, 0, 85, 0.25);
            border: 1px solid #ff0055;
            color: #ff0055;
            text-shadow: 0 0 8px #e22b68;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            animation: pulseDefeated 1.5s infinite alternate;
        }

        @keyframes pulseDefeated {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,0,85,0.5); }
            100% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,0,85,0.9); }
        }

        /* ==========================================================================
           4. AVATAR & BOSS INFO
           ========================================================================== */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        .avatar-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, #ff0055, #7000ff);
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.5), 0 0 30px rgba(255, 0, 85, 0.3);
            transition: all 0.5s ease;
            position: relative;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0d0915;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .avatar-img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            transition: filter 0.5s ease, transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(157, 78, 221, 0.6));
        }

        /* Defeated state for Avatar */
        .boss-card.is-defeated .avatar-frame {
            background: linear-gradient(135deg, #4a4a5a, #1a1a24);
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .boss-card.is-defeated .avatar-img {
            filter: grayscale(100%) brightness(40%) contrast(120%);
            transform: scale(0.95);
        }

        .boss-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .boss-name {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, #d8b4fe, #ff2a6d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
            margin-bottom: 4px;
        }

        .boss-level {
            font-size: 0.9rem;
            color: #9d4edd;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ==========================================================================
           5. HEALTH BAR SECTION
           ========================================================================== */
        .hp-section {
            margin-bottom: 25px;
        }

        .hp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hp-title {
            color: #b8c1ec;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hp-values {
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
        }

        .hp-bar-bg {
            width: 100%;
            height: 18px;
            background: rgba(15, 10, 25, 0.8);
            border: 1px solid rgba(112, 0, 255, 0.4);
            border-radius: 10px;
            padding: 2px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #ff2a6d, #9d4edd);
            border-radius: 7px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
            position: relative;
        }

        /* Animated shine on health bar */
        .hp-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: hpShimmer 2s infinite;
        }

        @keyframes hpShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Health bar status color transitions */
        .hp-bar-fill.warning {
            background: linear-gradient(90deg, #ff5500, #ffaa00);
            box-shadow: 0 0 12px rgba(255, 85, 0, 0.6);
        }

        .hp-bar-fill.critical {
            background: linear-gradient(90deg, #ff0000, #ff0055);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
            animation: hpPulse 0.8s infinite alternate;
        }

        @keyframes hpPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* ==========================================================================
           6. ACTION BUTTONS
           ========================================================================== */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn {
            background: transparent;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn-attack {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(112, 0, 255, 0.2));
            border: 1px solid #ff0055;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.2);
        }

        .btn-attack:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff0055, #9d4edd);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            transform: translateY(-2px);
        }

        .btn-attack:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(255, 0, 85, 0.4);
        }

        .btn-heal {
            background: linear-gradient(135deg, rgba(5, 217, 232, 0.15), rgba(112, 0, 255, 0.15));
            border: 1px solid #05d9e8;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(5, 217, 232, 0.15);
        }

        .btn-heal:hover:not(:disabled) {
            background: linear-gradient(135deg, #05d9e8, #7000ff);
            box-shadow: 0 0 20px rgba(5, 217, 232, 0.5);
            transform: translateY(-2px);
        }

        .btn-heal:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(5, 217, 232, 0.3);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
            border-color: #4a4a5a !important;
        }

        /* Pulse highlight on Heal button when boss is defeated */
        .btn-heal.highlight-respawn {
            animation: pulseHealBtn 1.2s infinite alternate;
        }

        @keyframes pulseHealBtn {
            0% { border-color: #05d9e8; box-shadow: 0 0 5px #05d9e8; }
            100% { border-color: #00ffcc; box-shadow: 0 0 20px #00ffcc; }
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Background Spheres -->
    <div class="bg-glow-purple"></div>
    <div class="bg-glow-red"></div>

    <div class="wrapper">
        <!-- Main Boss Battle Card -->
        <div class="boss-card" id="bossCard">
            <!-- Damage Overlay Flash -->
            <div class="damage-flash" id="damageFlash"></div>

            <!-- Floating Text Popups Container -->
            <div class="floating-text-container" id="floatingContainer"></div>

            <!-- Header Section: Type Badge & Status -->
            <div class="card-header">
                <span class="boss-badge">Рейд-Босс</span>
                <span class="status-tag active" id="statusTag">БОЙ</span>
            </div>

            <!-- Avatar Frame & Image -->
            <div class="avatar-container">
                <div class="avatar-frame">
                    <div class="avatar-inner">
                        <img 
                            src="https://api.dicebear.com/7.x/bottts/svg?seed=BossDragon" 
                            alt="Кибер-Дракон" 
                            class="avatar-img"
                            id="bossAvatar"
                        >
                    </div>
                </div>
            </div>

            <!-- Title & Level -->
            <div class="boss-title">
                <h1 class="boss-name">Кибер-Дракон</h1>
                <div class="boss-level">Ур. 99 BOSS</div>
            </div>

            <!-- Health Bar Section -->
            <div class="hp-section">
                <div class="hp-header">
                    <span class="hp-title">ЗДОРОВЬЕ</span>
                    <span class="hp-values" id="hpText">100 / 100 HP</span>
                </div>
                <div class="hp-bar-bg">
                    <div class="hp-bar-fill" id="hpBar"></div>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="actions-grid">
                <button class="btn btn-attack" id="btnAttack">
                    Ударить ⚔️
                </button>
                <button class="btn btn-heal" id="btnHeal">
                    Лечить 🧪
                </button>
            </div>
        </div>
    </div>

    <script>
        // Game State Variables
        const MAX_HP = 100;
        const STEP_HP = 20;
        let currentHP = 100;

        // DOM Elements
        const bossCard = document.getElementById('bossCard');
        const bossAvatar = document.getElementById('bossAvatar');
        const hpBar = document.getElementById('hpBar');
        const hpText = document.getElementById('hpText');
        const statusTag = document.getElementById('statusTag');
        const btnAttack = document.getElementById('btnAttack');
        const btnHeal = document.getElementById('btnHeal');
        const damageFlash = document.getElementById('damageFlash');
        const floatingContainer = document.getElementById('floatingContainer');

        /**
         * Triggers a screen/card shake effect and visual hit flash
         */
        function triggerHitEffects() {
            // Restart card shake animation
            bossCard.classList.remove('shake');
            void bossCard.offsetWidth; // Trigger reflow to restart CSS animation
            bossCard.classList.add('shake');

            // Trigger red hit flash
            damageFlash.classList.add('active');
            setTimeout(() => {
                damageFlash.classList.remove('active');
            }, 120);
        }

        /**
         * Spawns floating damage/heal indicator text
         * @param {string} text - The text to display (e.g. "-20", "+20")
         * @param {string} type - 'damage' or 'heal'
         */
        function spawnFloatingText(text, type) {
            const el = document.createElement('div');
            el.className = `floating-number ${type}`;
            el.textContent = text;
            
            // Random horizontal offset for dynamic visual feel
            const randomOffset = (Math.random() - 0.5) * 40;
            el.style.left = `calc(50% + ${randomOffset}px)`;

            floatingContainer.appendChild(el);

            // Remove element after animation completes
            setTimeout(() => {
                el.remove();
            }, 800);
        }

        /**
         * Updates HP bar visually and manages boss state
         */
        function updateUI() {
            // Update numerical display
            hpText.textContent = `${currentHP} / ${MAX_HP} HP`;

            // Calculate percentage width
            const percentage = Math.max(0, (currentHP / MAX_HP) * 100);
            hpBar.style.width = `${percentage}%`;

            // Update health bar visual style based on HP level
            hpBar.classList.remove('warning', 'critical');
            if (percentage <= 30 && percentage > 0) {
                hpBar.classList.add('critical');
            } else if (percentage <= 60) {
                hpBar.classList.add('warning');
            }

            // Check Defeated / Active States
            if (currentHP === 0) {
                // Defeated State
                bossCard.classList.add('is-defeated');
                statusTag.textContent = 'ПОВЕРЖЕН';
                statusTag.className = 'status-tag defeated';
                
                btnAttack.disabled = true;
                btnHeal.classList.add('highlight-respawn');
                btnHeal.innerHTML = 'Возродить 🧪';
            } else {
                // Active Fight State
                bossCard.classList.remove('is-defeated');
                statusTag.textContent = 'БОЙ';
                statusTag.className = 'status-tag active';

                btnAttack.disabled = false;
                btnHeal.classList.remove('highlight-respawn');
                btnHeal.innerHTML = 'Лечить 🧪';
            }

            // Disable Heal button if already at full HP
            if (currentHP === MAX_HP) {
                btnHeal.disabled = true;
            } else if (currentHP > 0) {
                btnHeal.disabled = false;
            }
        }

        /**
         * Attack Action Handler
         */
        function attackBoss() {
            if (currentHP <= 0) return;

            currentHP = Math.max(0, currentHP - STEP_HP);
            triggerHitEffects();
            spawnFloatingText(`-${STEP_HP}`, 'damage');
            updateUI();
        }

        /**
         * Heal Action Handler
         */
        function healBoss() {
            if (currentHP >= MAX_HP) return;

            currentHP = Math.min(MAX_HP, currentHP + STEP_HP);
            spawnFloatingText(`+${STEP_HP}`, 'heal');
            updateUI();
        }

        // Event Listeners
        btnAttack.addEventListener('click', attackBoss);
        btnHeal.addEventListener('click', healBoss);

        // Remove shake class after animation finishes
        bossCard.addEventListener('animationend', (e) => {
            if (e.animationName === 'cardShake') {
                bossCard.classList.remove('shake');
            }
        });

        // Initialize state on load
        updateUI();
    </script>
</body>
</html>
